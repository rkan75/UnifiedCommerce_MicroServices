<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset admin password</title>
  <style>
    :root { font-family: system-ui, sans-serif; background: #f4f6f8; }
    body { max-width: 420px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    label { display: block; font-size: .85rem; color: #444; margin: .75rem 0 .25rem; }
    input { width: 100%; box-sizing: border-box; padding: .5rem .65rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    button { margin-top: 1.25rem; width: 100%; padding: .65rem; border: none; border-radius: 8px; background: #1e40af; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .err { color: #b91c1c; font-size: .9rem; margin-top: .75rem; }
    .ok { color: #166534; font-size: .9rem; margin-top: .75rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Set a new password</h1>
    <p id="hint" class="err" hidden></p>
    <div id="form-wrap">
      <label for="password">New password (min 8 characters)</label>
      <input id="password" type="password" autocomplete="new-password" />
      <label for="password2">Confirm password</label>
      <input id="password2" type="password" autocomplete="new-password" />
      <button type="button" id="submit">Update password</button>
    </div>
    <p class="ok" id="ok" hidden></p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get("token");
      var hint = document.getElementById("hint");
      var formWrap = document.getElementById("form-wrap");
      var okEl = document.getElementById("ok");

      if (!token) {
        hint.textContent = "Missing reset token. Use the link from your password reset request.";
        hint.hidden = false;
        formWrap.hidden = true;
        return;
      }

      document.getElementById("submit").onclick = function () {
        var p1 = document.getElementById("password").value;
        var p2 = document.getElementById("password2").value;
        if (p1.length < 8) { hint.textContent = "Password must be at least 8 characters."; hint.hidden = false; return; }
        if (p1 !== p2) { hint.textContent = "Passwords do not match."; hint.hidden = false; return; }
        hint.hidden = true;
        var btn = document.getElementById("submit");
        btn.disabled = true;
        fetch("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, password: p1 })
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            btn.disabled = false;
            if (!res.ok) {
              hint.textContent = res.j.message || "Reset failed.";
              hint.hidden = false;
              return;
            }
            formWrap.hidden = true;
            okEl.textContent = res.j.message || "Password updated. You can sign in.";
            okEl.hidden = false;
          })
          .catch(function () {
            btn.disabled = false;
            hint.textContent = "Network error.";
            hint.hidden = false;
          });
      };
    })();
  </script>
</body>
</html>
