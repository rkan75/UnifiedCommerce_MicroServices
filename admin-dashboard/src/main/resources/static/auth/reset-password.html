<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set new password | Store Admin</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #f0fdf4 100%);
      display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 2.5rem; max-width: 400px; width: 100%; }
    h1 { font-size: 1.5rem; font-weight: 600; color: #111; margin: 0 0 0.5rem 0; }
    .hint { color: #64748b; font-size: 0.875rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.375rem; }
    input { width: 100%; padding: 0.625rem 0.75rem; font-size: 1rem; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 1rem; }
    input:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 2px rgba(22,163,74,0.2); }
    button { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; font-weight: 600; color: #fff; background: #16a34a; border: none; border-radius: 8px; cursor: pointer; margin-top: 0.5rem; }
    button:hover { background: #15803d; }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .error { color: #dc2626; font-size: 0.875rem; margin-top: 1rem; }
    .ok { color: #15803d; font-size: 0.875rem; margin-top: 1rem; }
    .back { text-align: center; margin-top: 1.5rem; }
    .back a { color: #16a34a; text-decoration: none; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>New password</h1>
    <p class="hint" id="hint">Choose a new password (min 8 characters).</p>
    <form id="form">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
      <button type="submit" id="btn">Update password</button>
    </form>
    <p id="errorMsg" class="error" style="display:none;"></p>
    <p id="okMsg" class="ok" style="display:none;"></p>
    <div class="back"><a href="/admin-login">Sign in</a></div>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token') || '';
      var hint = document.getElementById('hint');
      if (!token) {
        hint.textContent = 'Missing reset token. Use the link from your email or the dev link from forgot-password.';
      }
      var form = document.getElementById('form');
      var btn = document.getElementById('btn');
      var errorMsg = document.getElementById('errorMsg');
      var okMsg = document.getElementById('okMsg');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (!token) return;
        errorMsg.style.display = 'none';
        okMsg.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Updating…';
        fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ token: token, password: document.getElementById('password').value })
        })
        .then(function(res) { return res.json().then(function(data) { return { res: res, data: data }; }); })
        .then(function(x) {
          if (x.res.ok) {
            okMsg.textContent = (x.data && x.data.message) ? x.data.message : 'Password updated.';
            okMsg.style.display = 'block';
            form.style.display = 'none';
            hint.style.display = 'none';
            return;
          }
          throw new Error((x.data && x.data.message) || 'Reset failed');
        })
        .catch(function(err) {
          errorMsg.textContent = err.message || 'Reset failed';
          errorMsg.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Update password';
        });
      });
    })();
  </script>
</body>
</html>
