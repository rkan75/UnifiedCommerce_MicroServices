<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accept invite | Store Admin</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #f0fdf4 100%);
      display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 2.5rem; max-width: 420px; width: 100%; }
    h1 { font-size: 1.5rem; font-weight: 600; color: #111; margin: 0 0 0.5rem 0; }
    .hint { color: #64748b; font-size: 0.875rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.375rem; }
    input { width: 100%; padding: 0.625rem 0.75rem; font-size: 1rem; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 1rem; }
    input:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 2px rgba(22,163,74,0.2); }
    button { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; font-weight: 600; color: #fff; background: #16a34a; border: none; border-radius: 8px; cursor: pointer; margin-top: 0.5rem; }
    button:hover { background: #15803d; }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .error { color: #dc2626; font-size: 0.875rem; margin-top: 1rem; }
    .ok { color: #15803d; font-size: 0.875rem; margin-top: 1rem; }
    .back { text-align: center; margin-top: 1.5rem; }
    .back a { color: #16a34a; text-decoration: none; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create your account</h1>
    <p class="hint" id="statusHint">Validating invite…</p>
    <form id="regForm" style="display:none;">
      <p class="hint" id="emailDisplay"></p>
      <label for="first_name">First name (optional)</label>
      <input id="first_name" name="first_name" type="text" autocomplete="given-name" />
      <label for="last_name">Last name (optional)</label>
      <input id="last_name" name="last_name" type="text" autocomplete="family-name" />
      <label for="password">Password (min 8 characters)</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
      <button type="submit" id="submitBtn">Register</button>
    </form>
    <p id="errorMsg" class="error" style="display:none;"></p>
    <p id="okMsg" class="ok" style="display:none;"></p>
    <div class="back"><a href="/admin-login">Sign in</a></div>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token') || '';
      var form = document.getElementById('regForm');
      var hint = document.getElementById('statusHint');
      var emailDisplay = document.getElementById('emailDisplay');
      var errorMsg = document.getElementById('errorMsg');
      var okMsg = document.getElementById('okMsg');
      var submitBtn = document.getElementById('submitBtn');
      if (!token) {
        hint.textContent = 'Missing invite token. Open the link from your invitation email.';
        return;
      }
      fetch('/auth/invite/info?token=' + encodeURIComponent(token), { credentials: 'include' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.valid) {
            hint.textContent = data.message || 'This invite is invalid or expired.';
            return;
          }
          hint.textContent = 'Complete registration for:';
          emailDisplay.textContent = data.email || '';
          form.style.display = 'block';
        })
        .catch(function() {
          hint.textContent = 'Could not validate invite. Try again later.';
        });
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        errorMsg.style.display = 'none';
        okMsg.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering…';
        fetch('/auth/invite/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            token: token,
            password: document.getElementById('password').value,
            first_name: document.getElementById('first_name').value.trim() || undefined,
            last_name: document.getElementById('last_name').value.trim() || undefined
          })
        })
        .then(function(res) { return res.json().then(function(data) { return { res: res, data: data }; }); })
        .then(function(x) {
          if (x.res.ok) {
            okMsg.textContent = (x.data && x.data.message) ? x.data.message : 'Registration complete. You can sign in.';
            okMsg.style.display = 'block';
            form.style.display = 'none';
            hint.style.display = 'none';
            return;
          }
          throw new Error((x.data && x.data.message) || 'Registration failed');
        })
        .catch(function(err) {
          errorMsg.textContent = err.message || 'Registration failed';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Register';
        });
      });
    })();
  </script>
</body>
</html>
