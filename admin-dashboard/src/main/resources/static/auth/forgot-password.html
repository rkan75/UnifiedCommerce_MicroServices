<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password | Store Admin</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #f0fdf4 100%);
      display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 2.5rem; max-width: 400px; width: 100%; }
    h1 { font-size: 1.5rem; font-weight: 600; color: #111; margin: 0 0 0.5rem 0; }
    .hint { color: #64748b; font-size: 0.875rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.375rem; }
    input { width: 100%; padding: 0.625rem 0.75rem; font-size: 1rem; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 1rem; }
    input:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 2px rgba(22,163,74,0.2); }
    button { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; font-weight: 600; color: #fff; background: #16a34a; border: none; border-radius: 8px; cursor: pointer; margin-top: 0.5rem; }
    button:hover { background: #15803d; }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .msg { font-size: 0.875rem; margin-top: 1rem; color: #374151; }
    .dev { font-size: 0.75rem; color: #64748b; word-break: break-all; margin-top: 0.5rem; }
    .back { text-align: center; margin-top: 1.5rem; }
    .back a { color: #16a34a; text-decoration: none; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset password</h1>
    <p class="hint">Enter your email. If an account exists, we process a reset (check your email when SMTP is configured).</p>
    <form id="form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" />
      <button type="submit" id="btn">Send reset link</button>
    </form>
    <p id="msg" class="msg" style="display:none;"></p>
    <p id="devHint" class="dev" style="display:none;"></p>
    <div class="back"><a href="/admin-login">Back to sign in</a></div>
  </div>
  <script>
    (function() {
      var form = document.getElementById('form');
      var btn = document.getElementById('btn');
      var msg = document.getElementById('msg');
      var devHint = document.getElementById('devHint');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        msg.style.display = 'none';
        devHint.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Sending…';
        fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          msg.textContent = (data && data.message) ? data.message : 'Request received.';
          msg.style.display = 'block';
          if (data && data.reset_url) {
            devHint.textContent = 'Dev — open this URL to reset: ' + data.reset_url;
            devHint.style.display = 'block';
          }
        })
        .catch(function() {
          msg.textContent = 'Request could not be sent.';
          msg.style.display = 'block';
        })
        .finally(function() {
          btn.disabled = false;
          btn.textContent = 'Send reset link';
        });
      });
    })();
  </script>
</body>
</html>
