# GCP Cloud Build - Build and push Docker images to Artifact Registry
# Usage: gcloud builds submit --config deploy/cloudbuild.yaml .
#
# Prerequisites:
#   - gcloud auth configure-docker REGION-docker.pkg.dev
#   - Create Artifact Registry repo: gcloud artifacts repositories create medusa-grocery --repository-format=docker --location=REGION

substitutions:
  _REGION: us-central1
  _REPO: medusa-grocery
  _BACKEND_IMAGE: backend
  _STOREFRONT_IMAGE: storefront
  _NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_f8e261468637babef6c09293ce362076755f516c3fd5fb40355e8b90c964eb42
  _NEXT_PUBLIC_BASE_URL: https://unifiedomnichannel.com
  _NEXT_PUBLIC_ALGOLIA_APP_ID: "8UPZHDU2DT"
  _NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY: "869234ab00b84d5ec9fcc79f1ff48658"
  _NEXT_PUBLIC_ALGOLIA_INDEX_NAME: products

steps:
  # Build Medusa backend (API + Admin)
  - name: "gcr.io/cloud-builders/docker"
    id: build-backend
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_BACKEND_IMAGE}:${BUILD_ID}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_BACKEND_IMAGE}:latest"
      - "-f"
      - "unifiedcommerce-grocery-store/Dockerfile"
      - "unifiedcommerce-grocery-store"

  # Build Next.js storefront (add Algolia via --substitutions=_NEXT_PUBLIC_ALGOLIA_APP_ID=xxx,_NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY=yyy)
  - name: "gcr.io/cloud-builders/docker"
    id: build-storefront
    args:
      - "build"
      - "--build-arg"
      - "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${_NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}"
      - "--build-arg"
      - "NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_ALGOLIA_APP_ID=${_NEXT_PUBLIC_ALGOLIA_APP_ID}"
      - "--build-arg"
      - "NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY=${_NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY}"
      - "--build-arg"
      - "NEXT_PUBLIC_ALGOLIA_INDEX_NAME=${_NEXT_PUBLIC_ALGOLIA_INDEX_NAME}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_STOREFRONT_IMAGE}:${BUILD_ID}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_STOREFRONT_IMAGE}:latest"
      - "-f"
      - "unifiedcommerce-grocery-store-storefront/Dockerfile"
      - "unifiedcommerce-grocery-store-storefront"
    waitFor: ["-"]  # Run in parallel with backend

  # Push backend image
  - name: "gcr.io/cloud-builders/docker"
    id: push-backend
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_BACKEND_IMAGE}"
    waitFor: ["build-backend"]

  # Push storefront image
  - name: "gcr.io/cloud-builders/docker"
    id: push-storefront
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_STOREFRONT_IMAGE}"
    waitFor: ["build-storefront"]

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_BACKEND_IMAGE}:${BUILD_ID}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_BACKEND_IMAGE}:latest"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_STOREFRONT_IMAGE}:${BUILD_ID}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_STOREFRONT_IMAGE}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
